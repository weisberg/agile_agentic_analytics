name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install marketplace tooling
        run: npm ci

      - name: Validate generated marketplace files
        run: |
          npm run render:check
          npm run validate

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      # Kept non-blocking: mypy currently fails on a duplicate module name
      # (two scripts named content_analysis.py under marketing-analytics).
      # Flip to blocking once that collision is resolved (e.g. --explicit-package-bases).
      - name: Type check with mypy
        continue-on-error: true
        run: mypy plugins/

      - name: Audit all plugins (health, manifests, frontmatter)
        run: python plugins/plugin-manager/skills/plugin-health/scripts/plugin_audit.py --json

      # Non-blocking for one release per AAA_PLAN Phase 1.2; then remove
      # continue-on-error so routing accuracy below threshold fails the build.
      - name: Routing eval (deterministic tier)
        continue-on-error: true
        run: python scripts/routing_eval.py --format text --threshold 0.85

      - name: Run tests with coverage
        run: pytest --cov=plugins --cov-report=xml -x

      - name: Validate SKILL.md files are under 500 lines
        run: |
          failed=0
          for f in $(find . -name "SKILL.md"); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 500 ]; then
              echo "FAIL: $f has $lines lines (max 500)"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then exit 1; fi
          echo "All SKILL.md files are under 500 lines"

      - name: Validate marketplace JSON files
        run: python -m json.tool .claude-plugin/marketplace.json > /dev/null
      - name: Validate Codex marketplace JSON
        run: python -m json.tool .agents/plugins/marketplace.json > /dev/null

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
