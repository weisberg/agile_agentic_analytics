[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aaa-gemsearch"
version = "0.1.1"
description = "Local EmbeddingGemma 2 file search, complementary to vaultli"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "sentence-transformers==6.1.0",
    "transformers==5.19.0",
    "torch==2.14.1",
    "pypdf==6.20.1",
    "pillow==12.3.0",
    "torchvision==0.29.1",
]
readme = "README.md"

[project.scripts]
gemsearch = "gemsearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
