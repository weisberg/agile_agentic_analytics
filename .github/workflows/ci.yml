name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install marketplace tooling
        run: npm ci

      - name: Validate generated marketplace files
        run: |
          npm run render:check
          npm run validate

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate experimentation notebook mirror
        run: python scripts/sync_experimentation_notebook.py --check

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: |
          mypy --python-version 3.12 --ignore-missing-imports \
            scripts/routing_eval.py \
            scripts/behavioral_skill_eval.py \
            scripts/sync_experimentation_notebook.py \
            plugins/plugin-manager/skills/plugin-health/scripts/plugin_audit.py \
            plugins/plugin-manager/skills/skillopt-rollout-evidence/scripts/collect_flywheel_evidence.py \
            plugins/plugin-manager/skills/plugin-devex-review/scripts/devex_check.py \
            plugins/plugin-manager/skills/upstream-skill-harvest/scripts/harvest_check.py \
            plugins/knowledge-base/scripts/kb_ops.py \
            plugins/knowledge-base/scripts/generate_kb_roadmap_skills.py \
            plugins/lead-analyst/scripts/profile_table.py \
            plugins/marketing-analytics/skills/data-extraction/scripts/validate_extract.py \
            plugins/marketing-analytics/skills/email-analytics/scripts/deliverability_check.py \
            plugins/marketing-analytics/skills/email-analytics/scripts/engagement_analysis.py \
            plugins/marketing-analytics/skills/email-analytics/scripts/list_health.py \
            plugins/marketing-analytics/skills/email-analytics/scripts/send_time_optimizer.py \
            plugins/marketing-analytics/skills/funnel-analysis/scripts/build_funnel.py \
            plugins/marketing-analytics/skills/funnel-analysis/scripts/funnel_stats.py \
            plugins/marketing-analytics/skills/funnel-analysis/scripts/revenue_impact.py

      - name: Audit all plugins (health, manifests, frontmatter, strict sections)
        run: python plugins/plugin-manager/skills/plugin-health/scripts/plugin_audit.py --strict-sections --json

      - name: Routing eval (deterministic tier)
        run: python scripts/routing_eval.py --format text --threshold 0.90

      - name: Behavioral skill eval (deterministic tier)
        run: python scripts/behavioral_skill_eval.py --format text

      - name: Run tests with coverage
        run: pytest --cov=plugins --cov-report=xml -x

      - name: Validate SKILL.md files are under 500 lines
        run: |
          failed=0
          for f in $(find . -name "SKILL.md"); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 500 ]; then
              echo "FAIL: $f has $lines lines (max 500)"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then exit 1; fi
          echo "All SKILL.md files are under 500 lines"

      - name: Validate marketplace JSON files
        run: python -m json.tool .claude-plugin/marketplace.json > /dev/null
      - name: Validate Codex marketplace JSON
        run: python -m json.tool .agents/plugins/marketplace.json > /dev/null

      - name: Claude harness smoke validation
        run: ./scripts/smoke-claude.sh

      - name: Codex harness smoke validation
        run: ./scripts/smoke-codex.sh

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
