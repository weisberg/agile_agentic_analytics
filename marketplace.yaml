marketplace:
  name: agile-agentic-analytics
  displayName: Agile Agentic Analytics
  description: A marketplace of Claude Code and Codex plugins for agile agentic analytics.
  version: 0.1.0
  owner:
    name: Brian Weisberg
    email: ""
  repository: https://github.com/weisberg/agile_agentic_analytics

defaults:
  license: MIT
  installPolicy: AVAILABLE
  authPolicy: ON_INSTALL
  category: Developer Tools
  brandColor: "#2563EB"
  author:
    name: Brian Weisberg
    email: ""
    url: ""
  codex:
    installation: AVAILABLE
    authentication: ON_INSTALL
    interface:
      developerName: Brian Weisberg
      brandColor: "#2563EB"
  claude:
    defaultEnabled: true
    strict: true
    minVersion: "2.1.154"

plugins:
  - name: plugin-manager
    displayName: Plugin Manager
    path: plugins/plugin-manager
    description: Marketplace maintenance workflows for creating, validating, harvesting, syncing, and publishing agent plugins.
    version: 0.1.0
    homepage: https://github.com/weisberg/agile_agentic_analytics/tree/main/plugins/plugin-manager
    repository: https://github.com/weisberg/agile_agentic_analytics
    keywords:
      - plugin-manager
      - plugin-development
      - marketplace
      - skills
      - validation
      - health
      - doctor
      - quality-gate
      - skill-improve
      - skillopt
      - skill-optimization
      - self-evolving-skills
      - validation-gate
      - checkpoint
      - publishing
      - release
      - devex
      - upstream-sync
      - gbrain
      - gstack
    capabilities:
      - Read
      - Write
    defaultPrompt:
      - Help me maintain and validate marketplace plugins.
    components:
      skills: true
      mcp: false
      apps: false
      hooks: false
      agents: false
    codex:
      interface:
        shortDescription: Maintain and validate Codex and Claude plugin packages.
        longDescription: Plugin Manager provides workflows for creating, auditing, improving, and releasing shared marketplace plugins.
    claude:
      defaultEnabled: true
      strict: true

