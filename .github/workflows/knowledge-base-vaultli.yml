name: Knowledge Base Vaultli

on:
  pull_request:
    paths:
      - ".github/workflows/knowledge-base-vaultli.yml"
      - "plugins/knowledge-base/**"
      - "plugins/plugin-manager/**"
      - "tests/test_knowledge_base/**"
      - "tests/test_plugins/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/knowledge-base-vaultli.yml"
      - "plugins/knowledge-base/**"
      - "plugins/plugin-manager/**"
      - "tests/test_knowledge_base/**"
      - "tests/test_plugins/**"

jobs:
  python-vaultli-and-plugin-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest numpy pandas pyyaml

      - name: Build and validate sample vault
        run: |
          PYTHONPATH=plugins/knowledge-base python -m vaultli --json root plugins/knowledge-base/references/samples/mini-vault
          PYTHONPATH=plugins/knowledge-base python -m vaultli --json index --root plugins/knowledge-base/references/samples/mini-vault
          PYTHONPATH=plugins/knowledge-base python -m vaultli --json validate --root plugins/knowledge-base/references/samples/mini-vault
          PYTHONPATH=plugins/knowledge-base python -m vaultli --json search --tag renewal-risk --root plugins/knowledge-base/references/samples/mini-vault --limit 3

      - name: Run plugin health audits
        run: |
          python plugins/plugin-manager/skills/plugin-health/scripts/plugin_audit.py --plugin knowledge-base --json
          python plugins/plugin-manager/skills/plugin-health/scripts/plugin_audit.py --plugin plugin-manager --strict-sections --json

      - name: Run plugin tests
        run: pytest tests/test_plugins tests/test_knowledge_base

  rust-vaultli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust vaultli
        working-directory: plugins/knowledge-base/vaultli/rs
        run: cargo test --locked
